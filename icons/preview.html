<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>虚拟入口图标预览</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; padding: 40px; }
  h1 { font-size: 24px; margin-bottom: 30px; }
  .grid { display: flex; flex-wrap: wrap; gap: 32px; }
  .icon-card {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: #222; padding: 24px; border-radius: 12px; min-width: 140px;
  }
  .icon-card img { width: 72px; height: 72px; }
  .icon-card .label { font-size: 14px; color: #aaa; }
  .icon-card .file { font-size: 11px; color: #666; font-family: monospace; }
</style>
</head>
<body>
<h1>虚拟入口图标 SVG 预览</h1>
<div class="grid">
  <div class="icon-card">
    <img src="ic_onekeylock.svg" alt="锁屏">
    <span class="label">一键锁屏</span>
    <span class="file">ic_onekeylock.svg</span>
  </div>
  <div class="icon-card">
    <img src="wifi_on.svg" alt="WiFi 开启">
    <span class="label">WiFi 开启</span>
    <span class="file">wifi_on.svg</span>
  </div>
  <div class="icon-card">
    <img src="wifi_off.svg" alt="WiFi 关闭">
    <span class="label">WiFi 关闭</span>
    <span class="file">wifi_off.svg</span>
  </div>
  <div class="icon-card">
    <img src="http_server_on.svg" alt="服务器 运行中">
    <span class="label">服务器 运行中</span>
    <span class="file">http_server_on.svg</span>
  </div>
  <div class="icon-card">
    <img src="http_server_off.svg" alt="服务器 已停止">
    <span class="label">服务器 已停止</span>
    <span class="file">http_server_off.svg</span>
  </div>
</div>
</body>
</html>
